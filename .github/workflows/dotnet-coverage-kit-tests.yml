name: dotnet-coverage-kit tests

on:
  pull_request:
    paths:
      - "plugins/dotnet-coverage-kit/**"
  push:
    branches: [main]
    paths:
      - "plugins/dotnet-coverage-kit/**"

jobs:
  gate-render-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Run coverage-gate render test
        run: python plugins/dotnet-coverage-kit/scripts/tests/test_coverage_gate.py
