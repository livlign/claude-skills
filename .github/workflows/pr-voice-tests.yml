name: pr-voice tests

on:
  pull_request:
    paths:
      - "plugins/pr-voice/**"
  push:
    branches: [main]
    paths:
      - "plugins/pr-voice/**"

jobs:
  corpus-profile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pr-corpus fixture test
        run: python plugins/pr-voice/scripts/tests/test_pr_corpus.py
