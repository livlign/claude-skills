# .github/workflows/coverage.yml
# Scaffolded by coverage-init. Adjust <solution.sln>, dotnet-version, branch name, and
# the --repo-filter (this repo's path substring, used to scope the denominator).
name: Coverage

on:
  pull_request:
    branches: [master]   # only PRs whose target (base) branch is master

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the gate can diff against the base branch
          # If this solution references SIBLING repos via relative ProjectReference paths
          # (e.g. ..\..\..\<sibling>\...), set `path: <this-repo>` here and check the siblings
          # out beside it so the relative paths resolve. coverage-init fills this block when it
          # detects cross-repo references:
          # path: <this-repo>
      # - name: Checkout <sibling-repo>            # one per referenced sibling; remove if none
      #   uses: actions/checkout@v4
      #   with:
      #     repository: ${{ github.repository_owner }}/<sibling-repo>
      #     path: <sibling-repo>
      #     ref: master
      #     # token: ${{ secrets.CI_REPO_TOKEN }}  # add if the sibling repo is private
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install --quiet pyyaml

      # Collects coverage per test project and writes coverage/html/Cobertura.xml (repo-scoped
      # via the file filter). Scripts live under .claude/coverage/tools/, config under refs/.
      - name: Coverage
        run: ./.claude/coverage/tools/run-coverage.sh <solution.sln> ./coverage .claude/coverage/refs/coverage.runsettings "+*<repo-path-substring>*"

      # Full gate: ratchet + diff coverage on changed lines + scope-change guard. Publishes the
      # report to the PR summary and FAILS the job on any gate breach.
      # A maintainer can intentionally reduce scope by adding the label below to the PR.
      - name: Coverage gate
        # base_ref is passed via env (not interpolated into the shell) to avoid script injection;
        # coverage-gate.py additionally allowlists the ref before it reaches git.
        env:
          BASE_REF: ${{ github.base_ref }}
          SCOPE_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'coverage-scope-change') }}
        run: |
          ALLOW=""
          if [ "$SCOPE_CHANGE" = "true" ]; then
            ALLOW="--allow-scope-change"
          fi
          python .claude/coverage/tools/coverage-gate.py \
            --cobertura coverage/html/Cobertura.xml \
            --manifest .claude/coverage/refs/coverage-manifest.yml \
            --base "origin/$BASE_REF" \
            $ALLOW \
            --summary "$GITHUB_STEP_SUMMARY"
