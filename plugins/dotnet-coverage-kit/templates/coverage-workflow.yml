# .github/workflows/coverage.yml
# Scaffolded by coverage-init. Runs the SAME run-coverage.sh + coverage-gate.py you run locally, so
# the PR sees exactly what you see. Gate = diff coverage + ratchet + scope guard.
#
# Fill every <PLACEHOLDER>. Two blocks are for PRIVATE repos and are clearly marked:
#   * "PRIVATE NuGet feed (AWS CodeArtifact)"  : delete if your feed is public or not CodeArtifact.
#   * "PRIVATE sibling repos"                  : delete if the solution has no cross-repo references
#                                                or all siblings are public.
# Leaving them commented is safe; a private repo WILL fail restore/checkout until you enable them.
#
# Approving a scope change: the 'coverage-scope-change' label is the reviewer sign-off for a
# lowered floor or grown exclusions/cannot_test (it maps to coverage-gate.py --allow-scope-change;
# it does NOT waive diff coverage or a genuine ratchet drop). To sign off, ADD the label: the
# 'labeled' trigger below starts a fresh run whose payload carries the label. Do NOT use "Re-run
# jobs" to pick up a just-added label: GitHub replays the original, label-less payload, so the
# guard stays active and the gate fails again.
name: Coverage

on:
  pull_request:
    branches: [master]   # only PRs whose target (base) branch is master
    # 'labeled' is included so that applying the scope-change sign-off label (coverage-scope-change)
    # re-runs the gate automatically, with no manual re-run. 'unlabeled' is the other half: REMOVING
    # the label must re-assert the guard, or a revoked sign-off leaves a stale green check behind.
    # The other three are the normal triggers.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# id-token:write is required for the AWS OIDC step below (mint a short-lived token for CodeArtifact);
# contents:read is for actions/checkout. Safe to keep even if you delete the CodeArtifact block.
permissions:
  id-token: write
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the gate can diff against the base branch
          # If this solution references SIBLING repos via relative ProjectReference paths
          # (e.g. ..\..\..\<sibling>\...), set `path: <this-repo>` here and check the siblings
          # out beside it so the relative paths resolve. coverage-init fills this block when it
          # detects cross-repo references. NOTE: if you set `path:`, add
          # `working-directory: <this-repo>` to the Fetch/Coverage/gate steps below.
          # path: <this-repo>

      # --- PRIVATE sibling repos (DELETE this whole block if there are no cross-repo references, or
      # the siblings are public). A private sibling CANNOT be cloned by an unauthenticated checkout.
      # Authenticate with a GitHub App token (preferred: short-lived, scoped) OR a PAT secret.
      #
      # BEFORE ENABLING THIS, PROVE THE REFERENCES ACTUALLY LEAVE THE REPO. A deep relative path is
      # NOT evidence: `..\..\..\..\..\sharedlib\X.csproj` from a deeply nested csproj can climb five
      # levels and land back INSIDE this repo, when sharedlib is vendored here rather than a sibling.
      # Scaffolding a checkout for that case fails the whole job with
      # "repository '<ORG>/<sharedlib>' not found" and the fix is to DELETE the step, not to add a
      # token. Resolve the paths instead of eyeballing them:
      #
      #   python - <<'EOF'
      #   import os, re, glob
      #   inside = escaping = 0
      #   for p in glob.glob('**/*.csproj', recursive=True):
      #       txt = open(p, encoding='utf-8-sig', errors='ignore').read()
      #       for ref in re.findall(r'ProjectReference Include="([^"]+)"', txt):
      #           t = os.path.normpath(os.path.join(os.path.dirname(p), ref.replace('\\', '/')))
      #           if t.startswith('..'): escaping += 1; print('ESCAPES:', p, '->', t)
      #           else: inside += 1
      #   print('inside=%d escaping=%d' % (inside, escaping))
      #   EOF
      #
      # escaping == 0 means every reference resolves in-repo: delete this block. A vendored copy still
      # needs `scope.vendored_paths` in the manifest so it stays out of the DENOMINATOR, which is a
      # separate concern from checkout. ---
      # - name: Create GitHub App token (for private sibling checkout)
      #   id: app-token
      #   uses: actions/create-github-app-token@v1
      #   with:
      #     app-id: ${{ secrets.APP_ID }}
      #     private-key: ${{ secrets.APP_PRIVATE_KEY }}
      #     owner: <ORG>
      #     repositories: |
      #       <sibling-repo-1>
      #       <sibling-repo-2>
      # - name: Checkout <sibling-repo-1>
      #   uses: actions/checkout@v4
      #   with:
      #     repository: <ORG>/<sibling-repo-1>
      #     path: <sibling-repo-1>
      #     ref: master
      #     token: ${{ steps.app-token.outputs.token }}   # or a PAT: ${{ secrets.CI_REPO_TOKEN }}
      # (repeat one Checkout block per sibling. If a sibling references FURTHER siblings, add those
      #  too, or the solution will not build and the gate never runs.)

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install --quiet pyyaml

      # --- PRIVATE NuGet feed via AWS CodeArtifact (DELETE this whole block if your feed is public,
      # or if you use a different private feed: replace with that feed's auth). Without it,
      # `dotnet restore` 401s against a private feed. Uses GitHub OIDC, so no long-lived AWS keys. ---
      # - name: Configure AWS credentials (OIDC)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}   # TODO: the OIDC role ARN (repo secret)
      #     aws-region: <AWS_REGION>                            # TODO e.g. ap-southeast-1
      # - name: Login to AWS CodeArtifact
      #   run: |
      #     aws codeartifact login --tool dotnet \
      #       --domain <CA_DOMAIN> --domain-owner <CA_DOMAIN_OWNER> --repository <CA_REPOSITORY>

      # Make the base branch available to `git diff` as origin/<base>, so diff-coverage works.
      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=0 origin "$BASE_REF:refs/remotes/origin/$BASE_REF" || git fetch origin "$BASE_REF"

      # Resolve the file filter from the manifest rather than repeating it here. This is the whole
      # point of manifest `scope.file_filter`: CI and a local report.sh run must scope to the same
      # files, and a filter typed in two places drifts. It also picks up exclusions for any
      # `scope.vendored_paths` present in the checkout.
      - name: Resolve coverage file filter
        id: filter
        run: |
          echo "value=$(python .claude/coverage/tools/coverage-gate.py \
            --manifest .claude/coverage/refs/coverage-manifest.yml \
            --print-file-filter --repo-root . --repo-filter '<repo-path-substring>')" >> "$GITHUB_OUTPUT"

      # Collects coverage per test project and writes coverage/html/Cobertura.xml (repo-scoped via
      # the file filter). Scripts live under .claude/coverage/tools/, config under refs/.
      # run-coverage.sh hard-fails if a discovered test project is missing from the solution or emits
      # no results, so a silent undercount cannot slip through.
      - name: Coverage
        run: ./.claude/coverage/tools/run-coverage.sh <solution.sln> ./coverage .claude/coverage/refs/coverage.runsettings "${{ steps.filter.outputs.value }}"

      # Full gate: ratchet + diff coverage on changed lines + scope-change guard. Publishes the
      # report to the PR summary and FAILS the job on any gate breach.
      # A maintainer can intentionally reduce scope by adding the 'coverage-scope-change' label to
      # the PR; the 'labeled' trigger above makes that re-run the gate automatically.
      - name: Coverage gate
        # base_ref is passed via env (not interpolated into the shell) to avoid script injection;
        # coverage-gate.py additionally allowlists the ref before it reaches git.
        env:
          BASE_REF: ${{ github.base_ref }}
          SCOPE_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'coverage-scope-change') }}
        run: |
          ALLOW=""
          if [ "$SCOPE_CHANGE" = "true" ]; then
            ALLOW="--allow-scope-change"
          fi
          python .claude/coverage/tools/coverage-gate.py \
            --cobertura coverage/html/Cobertura.xml \
            --manifest .claude/coverage/refs/coverage-manifest.yml \
            --test-results-dir coverage/results \
            --base "origin/$BASE_REF" \
            $ALLOW \
            --summary "$GITHUB_STEP_SUMMARY"
