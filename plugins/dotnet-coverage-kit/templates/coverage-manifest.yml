schema_version: 1

# Generated by coverage-init, then reviewed and corrected by a human.
# This is the only file that differs per repo. It is the single source of truth for
# WHY each file is included, excluded, or cannot be tested.

# The coverage GOAL for the Adjusted (testable) slice: the level the backfill drives toward and
# the service is expected to sustain. This is an AIM, not a backfill stop-signal. generate-tests
# still drives the testable set to 100% branch coverage, with the only residual being documented
# `cannot_test` (see that skill). The target is used three ways:
#   1. Acceptance: after the backfill plus documented cannot_test, if Adjusted is BELOW target, the
#      residual/exclusions are too large, so re-open the sweep or escalate a shared-seam refactor.
#   2. Diff gate: `gate.diff_coverage_min_*` is set to the target so new/changed code enters AT the
#      target on every PR (that is what keeps Adjusted at the goal over time).
#   3. Floor: `baseline.recorded_overall` is recorded a few points BELOW target as headroom, so
#      normal churn does not flap CI red. Target is the aim; the floor is the don't-regress line.
# C0 (line) ~95% is realistic for a clean testable slice; C1 (branch) ~85% is the harder axis
# (defensive/guard branches). Tune per repo: a thin Adjusted slice may not sustain 95% C1.
target:
  c0: 95              # Adjusted line coverage goal
  c1: 85              # Adjusted branch coverage goal

baseline:
  ref: ""              # git sha tagged as the baseline after the backfill merges
  recorded_overall:    # filled by coverage-report at baseline; becomes the ratchet floor
    c0: null           # record a few points BELOW `target` (headroom), not at it
    c1: null

gate:
  # Set to `target` so changed lines enter at the goal on every PR (per-PR enforcement of target).
  diff_coverage_min_c0: 95    # % of changed lines that must be covered in a PR
  diff_coverage_min_c1: 85
  ratchet: true               # total coverage must not drop below baseline.recorded_overall

# Maps assemblies / path globs to report categories. For clean-architecture repos this
# carries real structure; for flat or legacy repos, map everything to "uncategorized".
category_map:
  domain:
    - "**/*.Domain/**"
  application:
    - "**/*.Application/**"
  # add/rename to match this repo; unmatched source falls under "uncategorized"

# Patterns whose uncovered state is intentional. Each needs a category and a reason.
# Reasons are reproduced verbatim in every report, so the report needs no AI to explain.
#
# TESTABILITY IS PER METHOD. A file-level exclusion is a REPORTING label, never a claim that the
# whole file is untestable. Two rules stop a MIXED file (some testable methods, some not) from
# hiding its testable slice behind one ambiguous line:
#   1. A glob ("**/Folder/**", or a "**/Name.cs" that matches several files) may ONLY cover a set
#      that is UNIFORMLY excluded: every file, every method. The moment any matched file has a
#      testable method, the glob is too coarse. Split it into one entry PER FILE.
#   2. A per-file entry that has any testable method carries a structured `carve_outs:` list
#      (method + lines + why-testable) plus an `excluded_rest` note (why the remainder is out).
#      The gate keeps each carve-out method IN scope; the backfill must cover it. Because
#      `carve_outs` is tied to that one file, a method name can never leak across files, which a
#      folder-glob "CARVE-OUT:" list cannot guarantee (that is exactly why mixed content must be
#      per-file, and why the gate WARNS when a carve-out-bearing pattern matches more than one file).
# The legacy "CARVE-OUT: MethodA, MethodB" prose inside `reason` is still read for back-compat, but
# new or edited entries should use the structured `carve_outs:` form. A missed carve-out is a false
# exclusion.
exclusions:
  # Uniformly excluded: no testable method anywhere in the matched set, so a glob is fine.
  - pattern: "**/Migrations/**"
    category: generated
    reason: "EF migrations are generated, not hand-written logic"
  - pattern: "**/*Dto.cs"
    category: dto-no-logic
    reason: "Data carrier with no behavior"
  # MIXED file: a PER-FILE entry (never a folder glob) with a structured carve-out list. The gate
  # keeps these methods in scope and counted; everything else in the file is excluded per excluded_rest.
  - pattern: "**/Services/OrderService.cs"
    category: integration-scope
    reason: "Order orchestration over a DbContext + payment SDK."
    carve_outs:
      - method: ValidateOrder
        lines: "40-88"          # informational; the gate keys off the method name, not these numbers
        testable: "pure input validation, branches on quantity/price, no deps"
      - method: MapToDto
        lines: "210-240"
        testable: "deterministic entity-to-DTO mapping"
    excluded_rest: "Place/Cancel/Refund reach the DbContext + payment SDK with no seam; cover via integration tests"

# Specific targets that cannot be unit-tested as-is. Populated by generate-tests when a
# unit fails the run-capture-fill precondition during the backfill. No source change is
# made to fix these during backfill. Scoped to the METHOD, never a whole file/folder.
# Each entry is tracked debt with a way out — `mitigation` is required.
cannot_test:
  - target: ""        # e.g. "OrderService.ScheduleRetry" — a specific method, not a file
    category: nondeterministic
    lines: ""         # optional, informational — e.g. "60-95"; the gate keys off the method name
    reason: ""        # e.g. "Reads DateTime.UtcNow directly; no clock seam, source frozen at baseline"
    mitigation: ""    # REQUIRED — the source change that unlocks it, e.g. "Inject IClock and read _clock.UtcNow",
                      # or "none — genuinely nondeterministic external boundary" when nothing would

# Canonical categories — use these exact spellings (hyphens, lower-case). The report groups by
# category, so drift like `framework_mismatch` vs `framework-incompatible` splits one real concept
# into noisy rows. The gate normalizes known aliases, but emit the canonical form.
#
# Exclusion categories (whole-file, covered by another test layer or no behavior):
#   integration-scope · e2e-scope · generated · dto-no-logic · non-product · mapper-config
#   (mapper-config = AutoMapper Profile / mapping-config classes: declarative CreateMap only, no
#    branches today — labeled apart from dto-no-logic so a future conditional MapFrom/ConvertUsing
#    is not silently hidden under a "data carrier" label. Re-check it if the profile gains logic.)
#
# cannot_test categories, by NATURE (the report splits §6 on this):
#   DESIGN DEBT — fixable by a source change; should trend to zero:
#     nondeterministic         — clock/id/random/IO flows into the asserted output, no seam
#     requires-source-change   — needs a seam / InternalsVisibleTo / extracted interface to test
#   STRUCTURAL — not debt, will NOT trend to zero (audit once, then leave):
#     unreachable-branch       — compiler-lowered/provably-unreachable branch (C1 artifact)
#     unreachable              — dead statement/path not reachable from any unit entry
#     dead-code                — method with no caller anywhere
#     method-absent            — stale entry; the method no longer exists (remove it)
#     framework-mismatch       — owning project targets a framework the test project can't reference
