schema_version: 1

# The dotnet-coverage-kit version whose rules and migrations this manifest has been brought up to.
# coverage-init stamps it; coverage-redo reads it, applies every MIGRATIONS.md entry from here
# forward, and re-stamps once they land. It is what turns "the kit was updated, apply it" into a
# bounded delta instead of a full re-audit, so it must never be stamped ahead of the work.
kit_version: ""

# Generated by coverage-init, then reviewed and corrected by a human.
# This is the only file that differs per repo. It is the single source of truth for
# WHY each file is included, excluded, or cannot be tested.

# The coverage GOAL for the Adjusted (testable) slice: the level the backfill drives toward and
# the service is expected to sustain. This is an AIM, not a backfill stop-signal. generate-tests
# still drives the testable set to 100% branch coverage, with the only residual being documented
# `cannot_test` (see that skill). The target is used three ways:
#   1. Acceptance: after the backfill plus documented cannot_test, if Adjusted is BELOW target, the
#      residual/exclusions are too large, so re-open the sweep or escalate a shared-seam refactor.
#   2. Diff gate: `gate.diff_coverage_min_*` is set to the target so new/changed code enters AT the
#      target on every PR (that is what keeps Adjusted at the goal over time).
#   3. Floor: `baseline.recorded_overall` is recorded a few points BELOW target as headroom, so
#      normal churn does not flap CI red. Target is the aim; the floor is the don't-regress line.
# C0 (line) ~95% is realistic for a clean testable slice; C1 (branch) ~85% is the harder axis
# (defensive/guard branches). Tune per repo: a thin Adjusted slice may not sustain 95% C1.
target:
  c0: 95              # Adjusted line coverage goal
  c1: 85              # Adjusted branch coverage goal

baseline:
  ref: ""              # git sha tagged as the baseline after the backfill merges
  recorded_overall:    # filled by coverage-report at baseline; becomes the ratchet floor
    c0: null           # record a few points BELOW `target` (headroom), not at it
    c1: null
  # In-scope (Adjusted) line total when the floor above was recorded. Stamped alongside it and used
  # only as a sanity check: if in-scope size later moves more than ~1.5x either way, the gate says
  # "check your filefilter" rather than letting a scope change masquerade as a coverage regression.
  # Leave null to skip the check.
  scope_lines: null

# WHICH FILES are measured at all, before any include/exclude classification. This is the
# ReportGenerator -filefilters expression, and it lives here so that a local report.sh run and the
# CI workflow read ONE definition. Holding it in two places (a CI yml, plus whatever someone types
# locally) is exactly how a repo ends up with exclusions in CI that local runs silently lack.
scope:
  # Include this repo's own sources; exclude code from other repos the build pulls in.
  #   e.g. "+*myrepo*;-*sharedlib*;-*otherrepo*"
  # Empty means "derive +*<repo-filter>*" from the argument passed to report.sh.
  file_filter: ""

  # VENDORED REFERENCE PROJECTS: first-party libraries COPIED INTO this repo as directories, rather
  # than consumed as a package or checked out as a sibling beside the repo. Declare each one here.
  #
  # This is the single declaration for them. It drives BOTH things that have to happen, so they
  # cannot drift apart:
  #
  #   1. MEASUREMENT  the path is excluded from the ReportGenerator filefilter, so its lines never
  #                   enter the denominator.
  #   2. TEST SCOPE   the path becomes an `exclusions` entry (category non-product), so the sweep
  #                   does not classify it, the backfill never opens a worklist item for it, and no
  #                   test is ever written against another repo's source.
  #
  # Getting only (1) is the trap, because the reported percentage comes out right and the mistake
  # looks fixed. The sweep reads the FILESYSTEM, not the coverage XML: one real case enumerated
  # 1,749 foreign files and would have generated tests for a library owned by another team. You do
  # not need to add a matching `exclusions` entry by hand; a duplicate is harmless if you do.
  #
  # Easy to miss, because a vendored directory lives UNDER the repo root, so its paths contain the
  # repo's own name and the `+*<repo>*` include swallows every file.
  #
  # An entry only takes effect when the directory actually exists, so declaring one ahead of a
  # migration that has not reached this repo yet is safe and is the recommended way to pre-empt it.
  #
  # Rule of thumb: if another repo owns the code and runs its own tests over it, it belongs here,
  # however it arrived. A vendoring migration does not transfer test ownership.
  vendored_paths: []   # e.g. ["sharedlib", "base-infra-kafka", "shared-asset-lib"]

gate:
  # WHICH CHECKS MAY FAIL CI. Default (absent or false): NONE of them.
  #
  # Everything below is still measured and reported on every run; `enforce` decides only whether a
  # breach turns the run red. Out of the box the run is red when the TEST RUN is red (build failure
  # or a failing test), never because a coverage number moved.
  #
  # Know what you are choosing. With `diff` unenforced, nothing mechanical requires a test for new
  # code, and the suite stays green precisely BECAUSE untested code keeps it green: the thresholds
  # below become an aim, and holding to them is a review responsibility rather than a mechanical one.
  # Re-arm per check as the repo is ready, e.g.:
  #   enforce: [diff]              # new/changed code must be tested; no ratchet flapping
  #   enforce: [diff, scope]       # ...and the skip-list cannot grow unreviewed
  #   enforce: true                # all three (ratchet, diff, scope)
  # `--enforce` on the CLI overrides this, so CI can enforce more than a local run.
  enforce: false

  # Set to `target` so changed lines enter at the goal on every PR (per-PR enforcement of target).
  # Advisory unless `enforce` includes `diff`.
  diff_coverage_min_c0: 95    # % of changed lines that must be covered in a PR
  diff_coverage_min_c1: 85
  ratchet: true               # compare total coverage against baseline.recorded_overall
                              # (`ratchet: false` skips the comparison entirely; `enforce` decides
                              #  whether a drop is merely reported or fails the run)

  # ESCAPE HATCH for the scope-change guard's test detection, normally left empty.
  #
  # The guard fails a PR that lands new source under an excluded path. Test code is exempt, because
  # every repo excludes its own tests from the measured denominator, so a PR that merely ADDS an
  # xUnit file would otherwise demand reviewer sign-off, which teaches reviewers to rubber-stamp the
  # one check that stops real logic being reclassified as untestable.
  #
  # Detection is by directory segment: "test"/"tests", `Foo.Tests`, `unit-tests`, `UserServiceTests`.
  # That covers standard .NET layouts. Add globs here ONLY for a layout it misses, e.g. tests kept
  # in a `Spec/` folder or beside the code they cover.
  #   e.g. ["**/Spec/**", "**/*Spec.cs"]
  # A pattern here exempts matching paths from the SCOPE guard only: diff coverage and the ratchet
  # are untouched. Pointing it at product code hides real scope reductions.
  test_path_patterns: []

# Maps assemblies / path globs to report categories. For clean-architecture repos this
# carries real structure; for flat or legacy repos, map everything to "uncategorized".
category_map:
  domain:
    - "**/*.Domain/**"
  application:
    - "**/*.Application/**"
  # add/rename to match this repo; unmatched source falls under "uncategorized"

# Patterns whose uncovered state is intentional. Each needs a category and a reason.
# Reasons are reproduced verbatim in every report, so the report needs no AI to explain.
#
# TESTABILITY IS PER METHOD. A file-level exclusion is a REPORTING label, never a claim that the
# whole file is untestable. Two rules stop a MIXED file (some testable methods, some not) from
# hiding its testable slice behind one ambiguous line:
#   1. A glob ("**/Folder/**", or a "**/Name.cs" that matches several files) may ONLY cover a set
#      that is UNIFORMLY excluded: every file, every method. The moment any matched file has a
#      testable method, the glob is too coarse. Split it into one entry PER FILE.
#   2. A per-file entry that has any testable method carries a structured `carve_outs:` list
#      (method + lines + why-testable) plus an `excluded_rest` note (why the remainder is out).
#      The gate keeps each carve-out method IN scope; the backfill must cover it. Because
#      `carve_outs` is tied to that one file, a method name can never leak across files, which a
#      folder-glob "CARVE-OUT:" list cannot guarantee (that is exactly why mixed content must be
#      per-file, and why the gate WARNS when a carve-out-bearing pattern matches more than one file).
# The legacy "CARVE-OUT: MethodA, MethodB" prose inside `reason` is still read for back-compat, but
# new or edited entries should use the structured `carve_outs:` form. A missed carve-out is a false
# exclusion.
exclusions:
  # Uniformly excluded: no testable method anywhere in the matched set, so a glob is fine.
  - pattern: "**/Migrations/**"
    category: generated
    reason: "EF migrations are generated, not hand-written logic"
  - pattern: "**/*Dto.cs"
    category: dto-no-logic
    reason: "Data carrier with no behavior"
  # MIXED file: a PER-FILE entry (never a folder glob) with a structured carve-out list. The gate
  # keeps these methods in scope and counted; everything else in the file is excluded per excluded_rest.
  - pattern: "**/Services/OrderService.cs"
    category: integration-scope
    reason: "Order orchestration over a DbContext + payment SDK."
    carve_outs:
      - method: ValidateOrder
        lines: "40-88"          # informational; the gate keys off the method name, not these numbers
        testable: "pure input validation, branches on quantity/price, no deps"
      - method: MapToDto
        lines: "210-240"
        testable: "deterministic entity-to-DTO mapping"
    excluded_rest: "Place/Cancel/Refund reach the DbContext + payment SDK with no seam; cover via integration tests"

# Specific targets that cannot be unit-tested as-is. Populated by generate-tests when a
# unit fails the run-capture-fill precondition during the backfill. No source change is
# made to fix these during backfill. Scoped to the METHOD, never a whole file/folder.
# Each entry is tracked debt with a way out — `mitigation` is required.
cannot_test:
  - target: ""        # e.g. "OrderService.ScheduleRetry" — a specific method, not a file
    category: nondeterministic
    lines: ""         # optional, informational — e.g. "60-95"; the gate keys off the method name
    reason: ""        # e.g. "Reads DateTime.UtcNow directly; no clock seam, source frozen at baseline"
    mitigation: ""    # REQUIRED — the source change that unlocks it, e.g. "Inject IClock and read _clock.UtcNow",
                      # or "none — genuinely nondeterministic external boundary" when nothing would

# Product bugs a characterization backfill FROZE instead of fixing. Rendered as a red
# "7. Latent bugs frozen by characterization (ACTION REQUIRED)" section plus a banner at the very top
# of REPORT.md / REPORT.html, so the backlog sits in the artifact people actually read.
#
# Why this exists: characterization mode pins what the code does TODAY, wrong behaviour included, so
# some tests assert a bug on purpose. Left unrecorded, "all green" reads as "the code is correct"
# when it only means "behaviour has not drifted".
#
# This is a DEFECT BACKLOG, not a coverage exemption. It does not affect scope, the Adjusted number,
# the ratchet, or the diff gate. Untestable *code* still goes to `cannot_test` above.
#
# RULES
#   - Fixing a bug means updating or deleting its characterization test IN THE SAME CHANGE. A correct
#     fix turns the suite red until you do, because the old test asserts the old wrong behaviour.
#   - Remove the entry once fixed. This list is the source of truth.
#   - Do NOT append findings to CANNOT-TEST.md: that file is regenerated from this manifest on every
#     report.sh run, so an append is silently lost.
#
# Severity drives ordering and the A/B/C "needs resolving" count in the banner:
#   A: security / cross-tenant (data visible or mutable across a tenant boundary)
#   B: data loss or corruption
#   C: unhandled exception surfacing as a 500
#   D: correctness / observability
#   E: dead code or a note, not a defect
latent_bugs: []
  # - severity: A
  #   target: "OrderRepository.DeleteAsync"     # class.method the defect lives in
  #   file: "src/Data/OrderRepository.cs:214"   # optional; path or path:line
  #   summary: "Ignores the current-tenant filter, so a caller can delete another tenant's rows."
  #   pinned_by: "DeleteAsync_DeletesAcrossTenants_IgnoresTenantFilter"   # test that freezes it

# Canonical categories — use these exact spellings (hyphens, lower-case). The report groups by
# category, so drift like `framework_mismatch` vs `framework-incompatible` splits one real concept
# into noisy rows. The gate normalizes known aliases, but emit the canonical form.
#
# Exclusion categories (whole-file, covered by another test layer or no behavior):
#   integration-scope · e2e-scope · generated · dto-no-logic · non-product · mapper-config
#   (mapper-config = AutoMapper Profile / mapping-config classes: declarative CreateMap only, no
#    branches today — labeled apart from dto-no-logic so a future conditional MapFrom/ConvertUsing
#    is not silently hidden under a "data carrier" label. Re-check it if the profile gains logic.)
#
# cannot_test categories, by NATURE (the report splits §6 on this):
#   DESIGN DEBT — fixable by a source change; should trend to zero:
#     nondeterministic         — clock/id/random/IO flows into the asserted output, no seam
#     requires-source-change   — needs a seam / InternalsVisibleTo / extracted interface to test
#   STRUCTURAL — not debt, will NOT trend to zero (audit once, then leave):
#     unreachable-branch       — compiler-lowered/provably-unreachable branch (C1 artifact)
#     unreachable              — dead statement/path not reachable from any unit entry
#     dead-code                — method with no caller anywhere
#     method-absent            — stale entry; the method no longer exists (remove it)
#     framework-mismatch       — owning project targets a framework the test project can't reference
